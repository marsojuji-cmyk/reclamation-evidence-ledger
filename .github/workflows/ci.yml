name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q ledger schemas ops pilots packets
      - name: Tests
        # The chip-dependent determinism test skips itself when data/ is absent.
        run: python -m pytest -q tests
