name: Bug Report
description: Create a report to help us improve pipeline reliability or data integrity
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please provide as much detail as possible to help reproduce the problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the unexpected behavior or error output.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'python -m ledger.change assess ...'
        2. With parameters ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, GDAL/Rasterio/GeoPandas versions.
      placeholder: macOS 15.0, Python 3.12.14, GeoPandas 1.2.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Tracebacks
      description: Paste any error outputs or stack traces.
      render: shell
