name: Feature Request
description: Suggest an idea or enhancement for the pipeline or visualization
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or methodology enhancement!
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or analytical limitation?
      placeholder: A clear and concise description of what the limitation is.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see happen or how the feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or academic/industry references.
